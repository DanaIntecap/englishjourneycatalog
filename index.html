<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>English Journey Catalog</title>
    <!-- Aquí conectamos el CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Buscador de Recursos</h2>
    
    <select id="levelFilter">
        <option value="All">Todos los niveles</option>
        <option value="A1">A1</option>
        <option value="A2">A2</option>
    </select>
    
    <select id="skillFilter">
        <option value="All">Todas las habilidades</option>
        <option value="Listening">Listening</option>
        <option value="Speaking">Speaking</option>
    </select>
    
    <button onclick="renderTable()">Filtrar</button>

    <table id="catalogTable">
        <thead>
            <tr>
                <th>Nombre del Recurso</th>
                <th>Nivel</th>
                <th>Skill</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <div id="resourceModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">Título</h2>
            
            <div class="ficha-section">
                <strong>🎯 Objetivo de Aprendizaje:</strong>
                <p id="modalObjective"></p>
            </div>
            <div class="ficha-section">
                <strong>📝 Instrucciones:</strong>
                <p id="modalInstructions"></p>
            </div>
            <div class="ficha-section">
                <strong>💡 Variaciones:</strong>
                <p id="modalVariations"></p>
            </div>
            
            <a id="modalLink" href="#" target="_blank">
                <button>Ir al Recurso</button>
            </a>
        </div>
    </div>

    <!-- Aquí conectamos los datos y luego la lógica -->
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
